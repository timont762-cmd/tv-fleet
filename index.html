<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Ситуационный центр — Мониторинг колонн и материальных средств</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://api-maps.yandex.ru/2.1/?apikey=ВАШ_API_КЛЮЧ&lang=ru_RU" type="text/javascript"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * { -webkit-box-sizing: border-box; -moz-box-sizing: border-box; box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #080a0f; color: #fff;
    }
    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

    /* ======================================================== */
    /* ТАКТИЧЕСКИЙ ДАШБОРД (СТРОГО 100% ШИРИНЫ И ВЫСОТЫ)       */
    /* ======================================================== */
    #dashboard-view {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(135deg, #07090e 0%, #0d121c 50%, #080a0f 100%);
      z-index: 50000;
      display: none;
      flex-direction: column;
      padding: 12px 16px;
      overflow: hidden !important;
    }

    .hud-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 8px; margin-bottom: 10px;
      height: 52px;
      flex-shrink: 0;
    }
    .hud-headline { display: flex; flex-direction: column; }
    .hud-tag {
      font-size: 9.5px; font-weight: bold; letter-spacing: 2px; color: #3b82f6; text-transform: uppercase;
      margin-bottom: 2px; display: flex; align-items: center; gap: 6px;
    }
    .hud-tag::before {
      content: ''; width: 6px; height: 6px; background: #2ecc71; border-radius: 50%; box-shadow: 0 0 8px #2ecc71;
    }
    .hud-title {
      font-size: 21px; font-weight: 900; color: #ffffff; text-transform: uppercase;
      letter-spacing: 1.2px; margin: 0;
    }

    /* Верхние ровные индикаторы KPI */
    .kpi-row { display: flex; gap: 8px; align-items: center; height: 100%; }
    .kpi-item {
      background: #111622;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 3px 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-width: 85px; height: 42px;
    }
    .kpi-label {
      font-size: 8.5px; font-weight: 800; color: #8fa0b5; text-transform: uppercase; letter-spacing: 0.8px;
      white-space: nowrap; line-height: 1;
    }
    .kpi-value {
      font-size: 18px; font-weight: 900; font-family: monospace; color: #fff; line-height: 1; margin-top: 3px;
    }

    /* РЯД КОЛОНОК: СТРОГО 100% ШИРИНЫ БЕЗ ВЫЛЕТА */
    .dash-row-container {
      display: flex;
      flex-direction: row;
      gap: 10px;
      flex: 1 1 auto;
      width: 100%;
      height: calc(100vh - 74px) !important;
      max-height: calc(100vh - 74px) !important;
      overflow: hidden !important; /* Убран горизонтальный скролл */
      align-items: stretch;
    }

    .dash-column {
      flex: 1 1 0; /* Равномерно делят всю ширину экрана */
      min-width: 0 !important; /* Разрешает колонкам пропорционально ужиматься */
      background: rgba(15, 21, 34, 0.92);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .dash-column-header {
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 8px;
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      height: 34px;
    }
    .dash-column-title {
      font-size: 12.5px; font-weight: 900; color: #ffffff; text-transform: uppercase;
      display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .dash-column-count {
      background: rgba(255, 255, 255, 0.15); color: #fff;
      font-size: 11px; font-weight: 900; padding: 2px 6px; border-radius: 4px;
      font-family: monospace; white-space: nowrap; flex-shrink: 0; margin-left: 4px;
    }

    .dash-column-body {
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .dash-column-body::-webkit-scrollbar { width: 3px; }
    .dash-column-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

    /* Карточка подразделения */
    .dash-car-card {
      background: #090c12;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 6px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .dash-card-top {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 3px;
    }
    .dash-car-unit {
      font-size: 11px; font-weight: 900; color: #f1f2f6; text-transform: uppercase;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .dash-car-badge-count {
      font-size: 9.5px; font-weight: 900; color: #74b9ff; font-family: monospace;
      background: rgba(59, 130, 246, 0.2); padding: 1px 4px; border-radius: 3px;
      white-space: nowrap; flex-shrink: 0; margin-left: 4px;
    }

    .dash-vehicles-list { display: flex; flex-direction: column; gap: 3px; }
    .dash-vehicle-row {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255, 255, 255, 0.04);
      padding: 3px 6px; border-radius: 4px; gap: 6px;
    }
    .dash-vehicle-plate {
      font-family: monospace; font-size: 12px; font-weight: 900; color: #ffd32a;
      letter-spacing: 0.6px; white-space: nowrap; flex-shrink: 0;
    }
    .dash-vehicle-driver {
      font-size: 10.5px; font-weight: bold; color: #e2e8f0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right;
    }

    .dash-card-bottom {
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 3px; margin-top: 1px;
    }
    .dash-card-route {
      font-size: 9.5px; color: #8fa0b5; font-weight: bold;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%;
    }
    .dash-card-status {
      font-size: 8px; font-weight: 900; text-transform: uppercase;
      padding: 1px 4px; border-radius: 3px; color: #fff; white-space: nowrap; flex-shrink: 0;
    }

    /* АДАПТИВНОЕ СЖАТИЕ ПРИ 5+ ВИДАХ МС */
    .cols-many .dash-column { gap: 0; }
    .cols-many .dash-column-title { font-size: 11px; }
    .cols-many .dash-column-header { padding: 4px 6px; height: 30px; }
    .cols-many .dash-column-body { padding: 4px; gap: 4px; }
    .cols-many .dash-car-card { padding: 4px 6px; gap: 3px; }
    .cols-many .dash-vehicle-plate { font-size: 10.5px; letter-spacing: 0.2px; }
    .cols-many .dash-vehicle-driver { font-size: 9.5px; }
    .cols-many .dash-car-unit { font-size: 10px; }
    .cols-many .dash-card-route { font-size: 8.5px; }

    .cargo-svg-icon {
      width: 14px; height: 14px; vertical-align: middle; margin-right: 5px; fill: currentColor; flex-shrink: 0;
    }

    /* БЕЙДЖ СВЯЗКИ НА ТВ С АВТОСКРЫТИЕМ */
    #tv-badge {
      position: absolute; top: 10px; right: 10px;
      background: rgba(18, 20, 24, 0.95);
      color: #fff; padding: 6px 12px; border-radius: 6px;
      font-size: 12px; z-index: 60000;
      border: 1px solid #333842;
      transition: opacity 0.5s ease;
    }
    #tv-badge b { color: #2ecc71; }

    /* ЗАЩИТА */
    #auth-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(14, 16, 20, 0.98);
      z-index: 100000;
      display: flex; align-items: center; justify-content: center;
    }
    .auth-card {
      background: #1a1c22; border: 1px solid #383d47;
      border-radius: 12px; padding: 24px 28px; width: 340px;
      display: flex; flex-direction: column; text-align: center;
    }
    .auth-card h2 { margin: 0 0 8px 0; font-size: 17px; color: #f1f2f6; text-transform: uppercase; }
    .auth-card p { margin: 0 0 14px 0; font-size: 12px; color: #888; }
    .auth-input {
      font-family: monospace; font-size: 18px; text-align: center; letter-spacing: 4px;
      padding: 10px; background: #111215; border: 1px solid #383d47; border-radius: 6px; color: #f1c40f; outline: none;
      margin-bottom: 10px;
    }
    .auth-err { font-size: 11px; color: #e74c3c; display: none; font-weight: bold; margin-bottom: 10px; }

    /* ПАНЕЛЬ ОПЕРАТОРА */
    #panel {
      position: absolute; top: 12px; left: 12px;
      width: 450px; max-height: calc(100vh - 24px);
      background: rgba(22, 24, 29, 0.97);
      border-radius: 12px; border: 1px solid #383d47;
      z-index: 1000; padding: 12px;
      display: flex; flex-direction: column;
    }
    #panel-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #2e323b; padding-bottom: 8px; margin-bottom: 10px;
    }
    #panel-header h3 { margin: 0; font-size: 15px; color: #f1f2f6; }

    .box {
      background: #1a1c22; border-radius: 8px; padding: 8px 10px;
      border: 1px solid #2b2f38; display: flex; flex-direction: column; margin-bottom: 8px;
    }

    label { font-size: 11px; color: #9aa0a6; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; }
    .row { display: flex; gap: 6px; margin-bottom: 6px; }

    input, select {
      background: #111215; border: 1px solid #383d47;
      border-radius: 6px; padding: 6px 10px; color: #fff; font-size: 13px; outline: none;
    }
    .plate-font {
      font-family: monospace; font-size: 13px; font-weight: bold;
      letter-spacing: 1px; text-transform: uppercase; color: #f1c40f;
    }

    button {
      padding: 7px 12px; border: none; border-radius: 6px;
      cursor: pointer; font-weight: bold; font-size: 12px;
    }
    .btn-green { background: #27ae60; color: #fff; }
    .btn-blue { background: #2980b9; color: #fff; }
    .btn-gray { background: #383d47; color: #fff; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .btn-purple { background: #8e44ad; color: #fff; }

    #search-box-input {
      background: #101216; border: 1px solid #484f5f;
      border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 13px; outline: none;
      margin-bottom: 8px;
    }

    #car-list {
      list-style: none; margin: 0; padding: 0;
      overflow-y: auto; max-height: calc(100vh - 430px);
    }
    .car-card {
      background: #1a1c22; border-radius: 8px; padding: 10px;
      border: 1px solid #2b2f38; border-left: 5px solid #fff;
      margin-bottom: 8px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .car-card.selected {
      border-color: #f1c40f; background: #222630;
      box-shadow: 0 0 12px rgba(241, 196, 15, 0.35);
    }
    .car-card-header { display: flex; justify-content: space-between; align-items: flex-start; cursor: pointer; }
    .car-card-unit { font-size: 13px; font-weight: bold; color: #f39c12; margin-bottom: 4px; }
    .badge-cargo-tag {
      background: #8e44ad; color: #fff; font-size: 11px; font-weight: bold;
      padding: 2px 6px; border-radius: 4px; margin-right: 4px;
    }
    .column-badge-tag {
      background: #d35400; color: #fff; font-size: 11px; font-weight: bold;
      padding: 2px 6px; border-radius: 4px; margin-right: 4px;
    }
    .time-badge {
      font-size: 11px; font-weight: bold; color: #ffd32a;
      background: rgba(0, 0, 0, 0.45); padding: 2px 5px; border-radius: 4px; font-family: monospace;
    }

    .column-plates-container {
      background: #121316; padding: 6px; border-radius: 6px; border: 1px solid #2a2e37;
    }
    .plate-item-row {
      display: flex; align-items: center; justify-content: space-between;
      background: #1f232b; border: 1px solid #363c4a; border-radius: 4px;
      padding: 4px 8px; font-size: 12px; margin-bottom: 3px;
    }

    .route-stage-list {
      background: #121316; border-radius: 6px; padding: 6px; border: 1px solid #282b33;
    }
    .route-stage-item { display: flex; align-items: center; padding: 3px 6px; border-radius: 4px; font-size: 12px; }
    .route-stage-item.current { background: rgba(39, 174, 96, 0.2); border: 1px solid #27ae60; color: #2ecc71; font-weight: bold; }
    .route-stage-item.next { background: rgba(41, 128, 185, 0.2); border: 1px solid #2980b9; color: #3498db; }
    .route-stage-item.done { color: #666; }

    .sub-box {
      display: none; flex-direction: column;
      background: #15171c; padding: 8px; border-radius: 6px; border: 1px solid #3e4452;
    }

    /* МЕТКИ КАРТЫ */
    .truck-wrap {
      position: absolute; transform: translate(-50%, -100%);
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer;
    }
    .truck-badge {
      display: none; background: rgba(14, 16, 20, 0.96);
      border: 2px solid rgba(255, 255, 255, 0.25); border-radius: 8px;
      margin-bottom: 6px; min-width: 180px; text-align: center;
    }
    .truck-wrap.active-selected { z-index: 99999 !important; }
    .truck-wrap.active-selected .truck-badge { display: block !important; border-color: #f1c40f !important; }
    .truck-wrap.active-selected .truck-circle { border-color: #f1c40f !important; }
    .truck-wrap.active-selected .truck-arrow { display: block !important; }

    .badge-unit-bar {
      background: #232a35; color: #f1c40f; font-size: 12px; font-weight: bold;
      padding: 4px 8px; border-bottom: 1px solid rgba(255,255,255,0.15);
      display: flex; justify-content: space-between; align-items: center;
    }
    .badge-cargo-chip { background: #8e44ad; color: #fff; font-size: 10px; padding: 2px 4px; border-radius: 3px; font-weight: bold; }
    .badge-count-tag { background: #d63031; color: #fff; font-size: 10px; padding: 2px 4px; border-radius: 3px; font-weight: bold; }
    .badge-body { padding: 6px 8px; }
    .badge-plate-row {
      display: flex; justify-content: space-between; font-size: 11px;
      background: rgba(255,255,255,0.08); padding: 2px 4px; border-radius: 3px; margin-bottom: 2px;
    }
    .badge-num { font-family: monospace; font-weight: bold; color: #ffffff; }
    .badge-driver { font-size: 11px; font-weight: bold; color: #f1c40f; }
    .badge-route-hint { font-size: 11px; color: #74b9ff; font-weight: bold; margin: 4px 0; }
    .badge-status-row { display: flex; justify-content: center; align-items: center; gap: 4px; }
    .badge-status { font-size: 10px; font-weight: bold; border-radius: 3px; padding: 2px 5px; color: #fff; }
    .badge-time { font-size: 10px; color: #ffd32a; font-family: monospace; }

    .icon-container { position: relative; }
    .truck-circle {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 2.5px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.8);
    }
    .truck-circle svg { width: 20px; height: 20px; fill: #fff; }
    .circle-count-badge {
      position: absolute; top: -4px; right: -6px;
      background: #d63031; color: #fff; font-size: 10px; font-weight: bold;
      border-radius: 8px; padding: 1px 4px; border: 1.5px solid #fff;
    }
    .truck-arrow {
      display: none; width: 0; height: 0;
      border-left: 6px solid transparent; border-right: 6px solid transparent;
      border-top: 6px solid #fff; margin-top: -1px;
    }
  </style>
</head>
<body>

  <!-- Экран авторизации -->
  <div id="auth-overlay">
    <div class="auth-card">
      <h2>Доступ ограничен</h2>
      <p>Введите пароль ситуационного центра</p>
      <input type="password" id="auth-pass" class="auth-input" placeholder="••••" maxlength="30" />
      <div id="auth-error" class="auth-err">Неверный пароль!</div>
      <button class="btn-blue" id="auth-submit-btn" style="padding: 10px; font-size: 14px;">Войти</button>
    </div>
  </div>

  <div id="map"></div>
  <div id="tv-badge">Код ТВ: <b id="peer-id-display">запуск...</b></div>

  <!-- ДАШБОРД ТАКТИЧЕСКИЙ (БЕЗ МАШИН "СТОИТ") -->
  <div id="dashboard-view">
    <div class="hud-header">
      <div class="hud-headline">
        <div class="hud-tag">ОПЕРАТИВНЫЙ МОНИТОРИНГ ТЫЛА</div>
        <h1 class="hud-title">НА ВЫЕЗДЕ В ДАННЫЙ МОМЕНТ</h1>
      </div>

      <div class="kpi-row">
        <div class="kpi-item" style="border-color: rgba(59, 130, 246, 0.45);">
          <span class="kpi-label">ВСЕГО НА ВЫЕЗДЕ</span>
          <span class="kpi-value" id="kpi-total" style="color: #3b82f6;">0</span>
        </div>
        <div class="kpi-item" style="border-color: rgba(46, 204, 113, 0.45);">
          <span class="kpi-label">В ПУТИ</span>
          <span class="kpi-value" id="kpi-moving" style="color: #2ecc71;">0</span>
        </div>
        <div class="kpi-item" style="border-color: rgba(92, 61, 153, 0.65);">
          <span class="kpi-label">НОЧЛЕГ</span>
          <span class="kpi-value" id="kpi-night" style="color: #a29bfe;">0</span>
        </div>
        <div class="kpi-item" style="border-color: rgba(230, 126, 34, 0.45);">
          <span class="kpi-label">ПОГРУЗКА</span>
          <span class="kpi-value" id="kpi-loading" style="color: #e67e22;">0</span>
        </div>
        <div class="kpi-item" style="border-color: rgba(41, 128, 185, 0.45);">
          <span class="kpi-label">ВЫГРУЗКА</span>
          <span class="kpi-value" id="kpi-unloading" style="color: #3498db;">0</span>
        </div>
      </div>
    </div>

    <!-- Контейнер колонок: 100% ширины экрана -->
    <div class="dash-row-container" id="dashboard-row-container"></div>
  </div>

  <!-- ПАНЕЛЬ ОПЕРАТОРА -->
  <div id="panel">
    <div id="panel-header">
      <h3>Мониторинг техники и колонн</h3>
      <div style="display: flex; gap: 4px;">
        <button class="btn-danger" id="btn-reset" style="padding: 3px 6px; font-size: 10px;">Сброс</button>
        <button class="btn-gray" id="btn-toggle-tv-panel" style="padding: 3px 6px; font-size: 10px;">Режим ТВ</button>
      </div>
    </div>

    <div class="row" style="background:#11141a; padding:6px; border-radius:6px; border:1px solid #282f3d;">
      <button class="btn-green" id="btn-export" style="flex:1; padding:5px; font-size:10.5px;">💾 Экспорт (Бэкап)</button>
      <button class="btn-gray" id="btn-import-trigger" style="flex:1; padding:5px; font-size:10.5px;">📂 Импорт</button>
      <input type="file" id="import-file-input" accept=".json" style="display:none;" />
    </div>

    <div class="row">
      <button class="btn-blue" id="btn-operator-dash" style="flex:1; padding: 6px; font-size: 11px;">📊 Табло МС (Оператор)</button>
      <button id="toggle-tv-screen-btn" class="btn-purple" style="flex:1.2; padding: 6px; font-size: 11px;">📺 Вывести Табло на ТВ</button>
    </div>

    <div class="box">
      <label>Добавить транспорт / колонну</label>
      <input type="text" id="unit-input" placeholder="Подразделение (1 взвод, РМО, 2 рота)" style="margin-bottom:6px;" />
      
      <div class="row">
        <input type="text" id="plate-input" class="plate-font" placeholder="Госномер (0000 РК 21)" maxlength="12" style="flex: 1.1;" />
        <input type="text" id="driver-input" placeholder="Фамилия водителя" style="flex: 1.1;" />
      </div>

      <div class="row">
        <select id="cargo-select" style="flex: 1.1; font-weight: bold; color: #f1c40f;">
          <option value="БП">БП</option>
          <option value="ГСМ (ДТ)">ГСМ (ДТ)</option>
          <option value="ГСМ (АБ)">ГСМ (АБ)</option>
          <option value="ПРОД">ПРОД</option>
          <option value="ВЕЩ">ВЕЩ</option>
          <option value="ВТИ">ВТИ</option>
          <option value="КЭС">КЭС</option>
        </select>
        <select id="status-select" style="flex: 1.1;">
          <option value="moving">🟢 В пути</option>
          <option value="night">🌙 Ночлег</option>
          <option value="loading">🟠 На погрузке</option>

  <script>
    var PASSWORD_HASH = "329f72c828fdef6d6135d52e9d59c7f5389e3a45f74086beed56be3992310d9a"; // Пароль: 1234

    function sha256(ascii) {
      function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
      var mathPow = Math.pow;
      var maxWord = mathPow(2, 32);
      var lengthProperty = 'length';
      var i, j;
      var result = '';
      var words = [];
      var asciiBitLength = ascii[lengthProperty] * 8;
      var hash = [];
      var k = [];
      var primeCounter = 0;
      var isComposite = {};

      for (var candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (i = 0; i < 313; i += candidate) { isComposite[i] = candidate; }
          hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
        }
      }

      ascii += '\x80';
      while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
      for (i = 0; i < ascii[lengthProperty]; i++) {
        j = ascii.charCodeAt(i);
        if (j >> 8) return;
        words[i >> 2] |= j << ((3 - i) % 4) * 8;
      }
      words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
      words[words[lengthProperty]] = (asciiBitLength);

      for (j = 0; j < words[lengthProperty];) {
        var w = words.slice(j, j += 16);
        var oldHash = hash;
        hash = hash.slice(0, 8);

        for (i = 0; i < 64; i++) {
          var w15 = w[i - 15], w2 = w[i - 2];
          var s0 = rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3);
          var s1 = rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10);
          var ch = (hash[4] & hash[5]) ^ (~hash[4] & hash[6]);
          var maj = (hash[0] & hash[1]) ^ (hash[0] & hash[2]) ^ (hash[1] & hash[2]);
          var temp1 = hash[7] + (rightRotate(hash[4], 6) ^ rightRotate(hash[4], 11) ^ rightRotate(hash[4], 25)) + ch + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + s0 + w[i - 7] + s1) | 0);
          var temp2 = (rightRotate(hash[0], 2) ^ rightRotate(hash[0], 13) ^ rightRotate(hash[0], 22)) + maj;

          hash = [(temp1 + temp2) | 0].concat(hash);
          hash[4] = (hash[4] + temp1) | 0;
        }

        for (i = 0; i < 8; i++) { hash[i] = (hash[i] + oldHash[i]) | 0; }
      }

      for (i = 0; i < 8; i++) {
        for (var i2 = 3; i2 >= 0; i2--) {
          var b = (hash[i] >> (8 * i2)) & 255;
          result += ((b < 16) ? 0 : '') + b.toString(16);
        }
      }
      return result;
    }

    var isTvUrl = window.location.search.indexOf('tv=1') !== -1;

    function checkAuth() {
      if (isTvUrl) {
        var overlay = document.getElementById('auth-overlay');
        if (overlay) overlay.style.display = 'none';
        return;
      }

      var match = window.location.search.match(/[?&]pass=([^&]+)/);
      var passParam = match ? match[1] : null;

      if (passParam && sha256(passParam) === PASSWORD_HASH) {
        document.getElementById('auth-overlay').style.display = 'none';
        sessionStorage.setItem('auth_token', PASSWORD_HASH);
        return;
      }

      if (sessionStorage.getItem('auth_token') === PASSWORD_HASH) {
        document.getElementById('auth-overlay').style.display = 'none';
      } else {
        document.getElementById('auth-overlay').style.display = 'flex';
      }
    }

    function handleLogin() {
      var val = document.getElementById('auth-pass').value;
      if (sha256(val) === PASSWORD_HASH) {
        sessionStorage.setItem('auth_token', PASSWORD_HASH);
        document.getElementById('auth-overlay').style.display = 'none';
      } else {
        var err = document.getElementById('auth-error');
        err.style.display = 'block';
        document.getElementById('auth-pass').value = '';
        setTimeout(function() { err.style.display = 'none'; }, 2000);
      }
    }

    document.getElementById('auth-submit-btn').onclick = handleLogin;
    document.getElementById('auth-pass').onkeydown = function(e) {
      if (e.keyCode === 13) handleLogin();
    };

    checkAuth();

    var ICONS_SVG = {
      bp: '<svg class="cargo-svg-icon" viewBox="0 0 24 24"><path d="M12 2C8 2 5 6 5 11c0 2.5 1 5 3 6.8V21l2-1 2 1 2-1 2 1v-3.2c2-1.8 3-4.3 3-6.8 0-5-3-9-7-9zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"/></svg>',
      fuel_dt: '<svg class="cargo-svg-icon" viewBox="0 0 24 24"><path d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33a2.5 2.5 0 0 0 2.5 2.5c.36 0 .69-.08 1-.22v5.72c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v16h10v-7.5h1.5v3.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V9c0-.69-.28-1.32-.73-1.77zM6 10V5h6v5H6z"/></svg>',
      fuel_ab: '<svg class="cargo-svg-icon" viewBox="0 0 24 24"><path d="M19 8c0-1.66-3.13-3-7-3S5 6.34 5 8v8c0 1.66 3.13 3 7 3s7-1.34 7-3V8zm-7-1c3.31 0 5 .85 5 1s-1.69 1-5 1-5-.85-5-1 1.69-1 5-1zm0 10c-3.31 0-5-.85-5-1v-2.18C8.16 14.47 9.94 15 12 15s3.84-.53 5-1.18V16c0 .15-1.69 1-5 1zm0-4c-3.31 0-5-.85-5-1v-2.18C8.16 10.47 9.94 11 12 11s3.84-.53 5-1.18V12c0 .15-1.69 1-5 1z"/></svg>',
      prod: '<svg class="cargo-svg-icon" viewBox="0 0 24 24"><path d="M18 4H6C3.79 4 2 5.79 2 8v8c0 2.21 1.79 4 4 4h12c2.21 0 4-1.79 4-4V8c0-2.21-1.79-4-4-4zm-8 4c0-.55.45-1 1-1s1 .45 1 1v8c0 .55-.45 1-1 1s-1-.45-1-1V8zm-4 1c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V9zm12 6c0 .55-.45 1-1 1s-1-.45-1-1V9c0-.55.45-1 1-1s1 .45 1 1v6z"/></svg>',

      vti: '<svg class="cargo-svg-icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>',
      kes: '<svg class="cargo-svg-icon" viewBox="0 0 24 24"><path d="M4 6c0-1.66 1.79-3 4-3s4 1.34 4 3v12c0 1.66-1.79 3-4 3s-4-1.34-4-3V6zm4-1c-1.1 0-2 .45-2 1s.9 1 2 1 2-.45 2-1-.9-1-2-1zm8 5c-1.1 0-2 .45-2 1s.9 1 2 1 2-.45 2-1-.9-1-2-1zm-2 2v6c0 1.66 1.79 3 4 3s4-1.34 4-3v-6c0-1.66-1.79-3-4-3s-4 1.34-4 3zm4 7c-1.1 0-2-.45-2-1v-4.1c.57.17 1.25.26 2 .26s1.43-.09 2-.26V18c0 .55-.9 1-2 1z"/></svg>'
    };

    var CARGO_CONFIG = {
      "БП":       { label: "БП",       svg: ICONS_SVG.bp,      color: "#e74c3c" },

      "ГСМ (АБ)": { label: "ГСМ (АБ)", svg: ICONS_SVG.fuel_ab, color: "#e67e22" },

      "КЭС":      { label: "КЭС",      svg: ICONS_SVG.kes,     color: "#d35400" }
    };
    var CARGO_TYPES = ["БП", "ГСМ (ДТ)", "ГСМ (АБ)", "ПРОД", "ВЕЩ", "ВТИ", "КЭС"];

    var STATUSES = {
      moving:    { label: "В пути",      color: "#27ae60" },
      night:     { label: "Ночлег",      color: "#5c3d99" },
      loading:   { label: "Погрузка",    color: "#e67e22" },
      unloading: { label: "Выгрузка",    color: "#2980b9" },
      stopped:   { label: "Стоит",       color: "#7f8c8d" }
    };

    var STAGE_KEYS = ["start", "loading", "unloading", "assembly"];
    var STAGE_META = {
      start:     { name: "Пункт начала",       icon: "🏁" },
      loading:   { name: "Пункт погрузки",     icon: "📦" },
      unloading: { name: "Пункт выгрузки",     icon: "📤" },
      assembly:  { name: "Р-н сосредоточения", icon: "🛡️" }
    };

    var STORAGE_KEY = "yandex_fleet_boss_hud_v41";

    function getNowTimeString() {
      var d = new Date();
      var pad = function(n) { return (n < 10 ? '0' : '') + n; };
      return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + ' ' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1);
    }

    var defaultState = {
      updatedAt: 1,
      tvScreenMode: 'map',
      cars: {
        "car_1": {
          id: "car_1",
          unit: "1 ВЗВОД ПОДВОЗА",
          cargo: "ГСМ (ДТ)",
          vehicles: [
            { number: "1234 РК 21", driver: "Иванов И.И." },
            { number: "5678 ВН 77", driver: "Петров А.С." }
          ],
          status: "moving",
          statusUpdatedAt: getNowTimeString(),
          stageIndex: 0,
          coords: [55.75, 37.61],
          routeNames: { start: "Батайск", loading: "Склад №3", unloading: "Донецк", assembly: "Матвеев Курган" }
        },
        "car_2": {

          unit: "2 ВЗВОД ПОДВОЗА",
          cargo: "КЭС",
          vehicles: [
            { number: "3456 ОР 21", driver: "Ковалев Д.Н." },

          ],

      }
    };

    function sanitizeCarData(car) {
      if (!car) return car;
      if (!car.cargo || !CARGO_CONFIG[car.cargo]) car.cargo = "БП";
      if (!car.status || !STATUSES[car.status]) car.status = "moving";
      if (!car.statusUpdatedAt) car.statusUpdatedAt = getNowTimeString();
      if (!car.vehicles || !Array.isArray(car.vehicles) || car.vehicles.length === 0) {
        if (car.plates && Array.isArray(car.plates)) {
          car.vehicles = car.plates.map(function(p) { return { number: p, driver: "" }; });
        } else if (car.plate) {
          car.vehicles = [{ number: car.plate, driver: "" }];
        } else {
          car.vehicles = [{ number: "0000 РК 21", driver: "" }];
        }
      }
      return car;
    }

    var appData = loadData();
    var selectedCarId = null;
    var activeEditCarId = null;
    var activeFullEditCarId = null;
    var searchQuery = "";
    var isApplyingRemoteView = false;

    function loadData() {
      try {
        var d = localStorage.getItem(STORAGE_KEY);
        if (d) {
          var parsed = JSON.parse(d);
          if (parsed.cars) {
            for (var k in parsed.cars) { parsed.cars[k] = sanitizeCarData(parsed.cars[k]); }
          }
          if (!parsed.tvScreenMode) parsed.tvScreenMode = 'map';
          if (!parsed.updatedAt) parsed.updatedAt = new Date().getTime();
          return parsed;
        }
        return defaultState;
      } catch (e) {
        return defaultState;
      }
    }

    function saveData() {
      appData.updatedAt = new Date().getTime();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      broadcastData();
    }

    function applyLocalScreenMode(mode) {
      var dash = document.getElementById('dashboard-view');
      if (!dash) return;
      if (mode === 'dashboard') {
        dash.style.display = 'flex';
        renderDashboardView();
      } else {
        dash.style.display = 'none';
      }
    }

    /* РЕНДЕР ДАШБОРДА БЕЗ ВЫЛЕТА ЗА ПРЕДЕЛЫ ЭКРАНА */
    function renderDashboardView() {
      var container = document.getElementById('dashboard-row-container');
      if (!container) return;
      container.innerHTML = '';

      var groups = {};
      var totalActiveVehicles = 0;
      var movingCount = 0;
      var nightCount = 0;
      var loadingCount = 0;
      var unloadingCount = 0;

      for (var id in appData.cars) {
        var car = appData.cars[id];
        
        // ПОЛНОСТЬЮ ИСКЛЮЧАЕМ ТЕХНИКУ В СТАТУСЕ "СТОИТ"
        if (car.status === 'stopped') continue;

        var cg = car.cargo || 'БП';
        var vCnt = car.vehicles ? car.vehicles.length : 1;

        if (!groups[cg]) groups[cg] = [];
        groups[cg].push(car);
        totalActiveVehicles += vCnt;

        if (car.status === 'moving') movingCount += vCnt;
        else if (car.status === 'night') nightCount += vCnt;
        else if (car.status === 'loading') loadingCount += vCnt;
        else if (car.status === 'unloading') unloadingCount += vCnt;
      }

      document.getElementById('kpi-total').innerHTML = totalActiveVehicles;
      document.getElementById('kpi-moving').innerHTML = movingCount;
      document.getElementById('kpi-night').innerHTML = nightCount;
      document.getElementById('kpi-loading').innerHTML = loadingCount;
      document.getElementById('kpi-unloading').innerHTML = unloadingCount;

      var activeCargoKeys = [];
      for (var i = 0; i < CARGO_TYPES.length; i++) {
        var key = CARGO_TYPES[i];
        if (groups[key] && groups[key].length > 0) {
          activeCargoKeys.push(key);
        }
      }

      if (activeCargoKeys.length === 0) {
        container.className = 'dash-row-container';
        container.innerHTML = '<div style="width:100%; text-align:center; color:#64748b; font-size:18px; font-weight:bold; padding:40px 0;">Вся техника находится в пунктах постоянной дислокации (нет техники на выезде)</div>';
        return;
      }

      // При 5 и более активных видов МС активируем адаптивное сжатие шрифтов
      var colCount = activeCargoKeys.length;
      container.className = colCount >= 5 ? 'dash-row-container cols-many' : 'dash-row-container';

      for (var j = 0; j < activeCargoKeys.length; j++) {
        var cgKey = activeCargoKeys[j];
        var conf = CARGO_CONFIG[cgKey] || { label: cgKey, svg: ICONS_SVG.bp, color: "#3b82f6" };
        var carsInGroup = groups[cgKey] || [];
        var groupTotal = 0;
        for (var c = 0; c < carsInGroup.length; c++) {
          groupTotal += (carsInGroup[c].vehicles ? carsInGroup[c].vehicles.length : 1);
        }

        var col = document.createElement('div');
        col.className = 'dash-column';
        col.style.borderTop = '3.5px solid ' + conf.color;

        var rowsHtml = '';
        for (var k = 0; k < carsInGroup.length; k++) {
          var item = carsInGroup[k];
          var vCount = item.vehicles ? item.vehicles.length : 1;
          var st = STATUSES[item.status] || STATUSES.stopped;

          var nextKey = STAGE_KEYS[((item.stageIndex || 0) + 1) % 4];
          var nextName = (item.routeNames && item.routeNames[nextKey]) || STAGE_META[nextKey].name;

          var vehiclesRows = '';
          if (item.vehicles) {
            for (var v = 0; v < item.vehicles.length; v++) {
              var veh = item.vehicles[v];
              vehiclesRows += '<div class="dash-vehicle-row">' +
                  '<span class="dash-vehicle-plate">' + veh.number + '</span>' +
                  '<span class="dash-vehicle-driver">' + (veh.driver ? '👤 ' + veh.driver : '') + '</span>' +
                '</div>';
            }
          }

          rowsHtml += '<div class="dash-car-card" onclick="onDashboardItemClick(\'' + item.id + '\')">' +
            '<div class="dash-card-top">' +
              '<span class="dash-car-unit">' + item.unit + '</span>' +
              '<span class="dash-car-badge-count">' + vCount + ' Т/С</span>' +
            '</div>' +
            '<div class="dash-vehicles-list">' + vehiclesRows + '</div>' +
            '<div class="dash-card-bottom">' +
              '<span class="dash-card-route">→ ' + nextName + '</span>' +
              '<span class="dash-card-status" style="background:' + st.color + ';">' + st.label + '</span>' +
            '</div>' +
          '</div>';
        }

        col.innerHTML = '<div class="dash-column-header">' +
            '<span class="dash-column-title" style="color:' + conf.color + ';">' + conf.svg + ' ' + conf.label + '</span>' +
            '<span class="dash-column-count">' + groupTotal + ' Т/С</span>' +
          '</div>' +
          '<div class="dash-column-body">' + rowsHtml + '</div>';

        container.appendChild(col);
      }
    }

    function onDashboardItemClick(carId) {
      if (!isTvUrl) {
        document.getElementById('dashboard-view').style.display = 'none';
        selectCar(carId);
      }
    }

      var btn = document.getElementById('toggle-tv-screen-btn');
      var isDash = appData.tvScreenMode === 'dashboard';
      if (btn) {
        btn.innerText = isDash ? '🗺️ Вернуть Карту на ТВ' : '📺 Вывести Табло на ТВ';
        btn.className = isDash ? 'btn-green' : 'btn-purple';
      }
    }

    document.getElementById('toggle-tv-screen-btn').onclick = function() {
      var nextMode = (appData.tvScreenMode === 'dashboard') ? 'map' : 'dashboard';
      appData.tvScreenMode = nextMode;
      updateTvModeButtonUI();
      saveData();

      if (activeConn && activeConn.open) {
        activeConn.send({ type: 'FORCE_SCREEN_MODE', mode: nextMode });

    document.getElementById('btn-operator-dash').onclick = function() {
      var dash = document.getElementById('dashboard-view');
      dash.style.display = 'flex';
      renderDashboardView();

    document.getElementById('btn-reset').onclick = function() {
      if (confirm("Сбросить все данные к исходным?")) {
        localStorage.removeItem(STORAGE_KEY);

        renderAll();

      var p = document.getElementById('panel');

    document.getElementById('btn-export').onclick = function() {
      var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
      var a = document.createElement('a');
      a.href = dataStr;
      a.download = "fleet_backup.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
    };

      document.getElementById('import-file-input').click();
    };

    document.getElementById('import-file-input').onchange = function(event) {
      var file = event.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          var imported = JSON.parse(e.target.result);
          if (imported && imported.cars) {
            for (var k in imported.cars) { imported.cars[k] = sanitizeCarData(imported.cars[k]); }
            appData = imported;
            saveData();
            renderAll();
            applyLocalScreenMode(appData.tvScreenMode);
            alert("✓ База загружена!");
          }
        } catch (err) { alert("Ошибка чтения файла: " + err.message); }
      };
      reader.readAsText(file);
      event.target.value = "";
    };

    var mainPlateInp = document.getElementById('plate-input');
    mainPlateInp.oninput = function(e) {
      var v = e.target.value.toUpperCase().replace(/[^0-9А-ЯA-Z]/g, '');
      var out = '';
      if (v.length > 0) out += v.substring(0, 4);
      if (v.length > 4) out += ' ' + v.substring(4, 6);
      if (v.length > 6) out += ' ' + v.substring(6, 9);
      e.target.value = out;
    };

    function matchesSearch(car, query) {
      if (!query) return true;
      if (car.unit && car.unit.toLowerCase().indexOf(query) !== -1) return true;
      if (car.cargo && car.cargo.toLowerCase().indexOf(query) !== -1) return true;
      if (car.vehicles) {
        for (var i = 0; i < car.vehicles.length; i++) {
          var v = car.vehicles[i];
          if (v.number && v.number.toLowerCase().indexOf(query) !== -1) return true;
          if (v.driver && v.driver.toLowerCase().indexOf(query) !== -1) return true;
        }
      }
      return false;
    }

    document.getElementById('search-box-input').oninput = function(e) {
      searchQuery = e.target.value.trim().toLowerCase();
      renderCarList();
    };

    document.getElementById('btn-collapse').onclick = function() {
      selectedCarId = null;
      activeEditCarId = null;
      activeFullEditCarId = null;
      renderAll();
      if (activeConn && activeConn.open) {
        activeConn.send({ type: 'SELECT_CAR', selectedCarId: null, coords: null });
      }
    };

    document.getElementById('btn-add-car').onclick = function() {
      var unit = document.getElementById('unit-input').value.trim();
      var plate = document.getElementById('plate-input').value.trim();
      var driver = document.getElementById('driver-input').value.trim();
      var cargo = document.getElementById('cargo-select').value;
      var status = document.getElementById('status-select').value;

      if (!plate) return alert("Введите номер машины!");

      var center = yMap ? yMap.getCenter() : [55.75, 37.61];
      var id = 'car_' + new Date().getTime();

      appData.cars[id] = {
        id: id,
        unit: unit || "ТРАНСПОРТ",
        cargo: cargo,
        vehicles: [{ number: plate, driver: driver }],
        status: status,
        statusUpdatedAt: getNowTimeString(),
        stageIndex: 0,
        coords: center,
        routeNames: { start: "Пункт начала", loading: "Пункт погрузки", unloading: "Пункт выгрузки", assembly: "Р-н сосредоточения" }
      };

      document.getElementById('plate-input').value = '';
      document.getElementById('driver-input').value = '';
      selectedCarId = id;
      saveData();
      renderAll();
    };

    // РЕДАКТИРОВАНИЕ КАРТОЧЕК И КОЛОНН
    function toggleFullEditBox(id) {
      activeEditCarId = null;
      activeFullEditCarId = (activeFullEditCarId === id) ? null : id;
      renderCarList();
    }

    function cancelFullEdit() {
      activeFullEditCarId = null;
      renderCarList();
    }

    function addVehicleInFullEdit(id) {
      var num = document.getElementById('add-more-num-' + id).value.trim();
      var drv = document.getElementById('add-more-drv-' + id).value.trim();
      if (!num) return alert("Введите номер техники");

      appData.cars[id].vehicles.push({ number: num, driver: drv });
      saveData();
      renderAll();
    }

    function removeVehicleInFullEdit(id, vIdx) {
      if (appData.cars[id].vehicles.length <= 1) {
        return alert("В группе должно оставаться хотя бы 1 т/с!");
      }
      appData.cars[id].vehicles.splice(vIdx, 1);
      saveData();
      renderAll();
    }

    function applyFullEdit(id) {
      var car = appData.cars[id];
      if (!car) return;

      car.unit = document.getElementById('edit-unit-' + id).value.trim() || "ТРАНСПОРТ";
      car.cargo = document.getElementById('edit-cargo-' + id).value;

      for (var i = 0; i < car.vehicles.length; i++) {
        var numInp = document.getElementById('edit-veh-num-' + id + '-' + i);
        var drvInp = document.getElementById('edit-veh-drv-' + id + '-' + i);
        if (numInp) car.vehicles[i].number = numInp.value.trim();
        if (drvInp) car.vehicles[i].driver = drvInp.value.trim();
      }

      activeFullEditCarId = null;
      saveData();
      renderAll();
    }

    function toggleEditBox(id) {
      activeFullEditCarId = null;
      activeEditCarId = (activeEditCarId === id) ? null : id;
      renderCarList();
    }

    function cancelEdit() {
      activeEditCarId = null;
      renderCarList();
    }

    function applyRouteNames(id) {
      if (!appData.cars[id]) return;

      appData.cars[id].routeNames = {
        start: document.getElementById('input-start-' + id).value.trim(),
        loading: document.getElementById('input-loading-' + id).value.trim(),
        unloading: document.getElementById('input-unloading-' + id).value.trim(),
        assembly: document.getElementById('input-assembly-' + id).value.trim()
      };

      activeEditCarId = null;
      saveData();
      renderAll();
    }

    // КАРТЫ ЯНДЕКС
    var yMap = null;
    var carPlacemarks = {};
    var mapMoveTimeout = null;

    if (window.ymaps) {
      ymaps.ready(initYandexMap);
    }

    function initYandexMap() {
      var initialCenter = [55.75, 37.61];
      for (var k in appData.cars) {
        if (appData.cars[k].coords) { initialCenter = appData.cars[k].coords; break; }
      }

      yMap = new ymaps.Map("map", {
        center: initialCenter,
        zoom: 7,
        controls: ['zoomControl', 'typeSelector', 'fullscreenControl']
      }, { suppressMapOpenBlock: true });

      yMap.events.add('click', function(e) {
        if (e.get('target') === yMap) {
          selectedCarId = null;
          renderAll();
        }
      });

      updateTvModeButtonUI();
      renderAll();

      if (isTvUrl) {
        document.getElementById('panel').style.display = 'none';
        if (appData.tvScreenMode === 'dashboard') {
          applyLocalScreenMode('dashboard');
        }
      }

      yMap.events.add('actionend', function() {
        if (isApplyingRemoteView) return;
        clearTimeout(mapMoveTimeout);
        mapMoveTimeout = setTimeout(function() { broadcastMapView(); }, 80);
      });
    }

    function getCarLayout(car, isSelected) {
      var st = STATUSES[car.status] || STATUSES.stopped;
      var nextStageKey = STAGE_KEYS[((car.stageIndex || 0) + 1) % 4];
      var nextName = (car.routeNames && car.routeNames[nextStageKey]) || STAGE_META[nextStageKey].name;
      var vehicles = (car.vehicles && car.vehicles.length > 0) ? car.vehicles : [{ number: "0000 РК 21", driver: "" }];
      var isColumn = vehicles.length > 1;

      var platesRowsHtml = '';
      for (var i = 0; i < vehicles.length; i++) {
        var v = vehicles[i];
        platesRowsHtml += '<div class="badge-plate-row">' +
            '<span class="badge-num">' + (v.number || '0000 РК 21') + '</span>' +
            (v.driver ? '<span class="badge-driver">👤 ' + v.driver + '</span>' : '') +
          '</div>';
      }

      var countBadgeHtml = isColumn ? '<span class="badge-count-tag">' + vehicles.length + ' Т/С</span>' : '';
      var circleCountBadgeHtml = isColumn ? '<div class="circle-count-badge">x' + vehicles.length + '</div>' : '';
      var wrapClass = isSelected ? "truck-wrap active-selected" : "truck-wrap";
      var cargoConf = CARGO_CONFIG[car.cargo] || { label: car.cargo || "БП", svg: ICONS_SVG.bp };

      return ymaps.templateLayoutFactory.createClass(
        '<div class="' + wrapClass + '">' +
          '<div class="truck-badge">' +
            '<div class="badge-unit-bar">' +
              '<span>' + (car.unit || 'ТРАНСПОРТ') + '</span>' +
              '<div style="display:flex; align-items:center; gap:4px;">' +
                '<span class="badge-cargo-chip">' + cargoConf.svg + ' ' + cargoConf.label + '</span>' +
                countBadgeHtml +
              '</div>' +
            '</div>' +
            '<div class="badge-body">' +
              '<div class="badge-plates-list">' + platesRowsHtml + '</div>' +
              '<div class="badge-route-hint">→ ' + nextName + '</div>' +
              '<div class="badge-status-row">' +
                '<span class="badge-status" style="background:' + st.color + '">' + st.label + '</span>' +
                '<span class="badge-time">🕒 ' + (car.statusUpdatedAt || '') + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="icon-container">' +
            '<div class="truck-circle" style="background:' + st.color + ';">' +
              '<svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-2 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>' +
            '</div>' +
            circleCountBadgeHtml +
          '</div>' +
          '<div class="truck-arrow"></div>' +
        '</div>'
      );
    }

    function renderAll() {
      if (!yMap) return;

      for (var cId in carPlacemarks) {
        if (!appData.cars[cId]) {
          yMap.geoObjects.remove(carPlacemarks[cId]);
          delete carPlacemarks[cId];
        }
      }

      for (var id in appData.cars) {
        (function(currentId) {
          var car = sanitizeCarData(appData.cars[currentId]);
          var isSelected = (currentId === selectedCarId);
          var layout = getCarLayout(car, isSelected);

          if (carPlacemarks[currentId]) {
            carPlacemarks[currentId].options.set('iconLayout', layout);
            carPlacemarks[currentId].options.set('zIndex', isSelected ? 9999 : 100);
            if (!carPlacemarks[currentId]._draggingNow) {
              carPlacemarks[currentId].geometry.setCoordinates(car.coords);
            }
          } else {
            var pm = new ymaps.Placemark(car.coords, {}, {
              iconLayout: layout,
              iconPane: 'overlaps',
              zIndex: isSelected ? 9999 : 100,
              draggable: true,
              cursor: 'pointer'
            });

            pm._draggingNow = false;
            pm.events.add('dragstart', function() { pm._draggingNow = true; });
            pm.events.add('dragend', function() {
              pm._draggingNow = false;
              appData.cars[currentId].coords = pm.geometry.getCoordinates();
              saveData();
            });

            pm.events.add('click', function(e) {
              e.stopPropagation();
              selectCar(selectedCarId === currentId ? null : currentId);
            });

            yMap.geoObjects.add(pm);
            carPlacemarks[currentId] = pm;
          }
        })(id);
      }

      renderCarList();
      renderDashboardView();
    }

    function renderCarList() {
      var list = document.getElementById('car-list');
      if (!list) return;
      list.innerHTML = '';
      var count = 0;

      for (var id in appData.cars) {
        var car = sanitizeCarData(appData.cars[id]);
        if (!matchesSearch(car, searchQuery)) continue;
        count++;

        var st = STATUSES[car.status] || STATUSES.stopped;
        var isSelected = (id === selectedCarId);
        var isEditing = (id === activeEditCarId);
        var isFullEditing = (id === activeFullEditCarId);
        var vehicles = car.vehicles || [];
        var isColumn = vehicles.length > 1;

        var li = document.createElement('li');
        li.className = 'car-card' + (isSelected ? ' selected' : '');
        li.style.borderLeftColor = st.color;

        var stagesHtml = '';
        STAGE_KEYS.forEach(function(key, idx) {
          var meta = STAGE_META[key];
          var name = (car.routeNames && car.routeNames[key]) || 'Не указан';
          var cls = '';
          var tag = '';

          if (idx === (car.stageIndex || 0)) {
            cls = 'current';
            tag = '• СЕЙЧАС ТУТ';
          } else if (idx === ((car.stageIndex || 0) + 1) % 4) {
            cls = 'next';
            tag = '➔ СЛЕДУЮЩИЙ';
          } else if (idx < (car.stageIndex || 0)) {
            cls = 'done';
            tag = '✓ пройден';
          }

          stagesHtml += '<div class="route-stage-item ' + cls + '">' +
              '<span>' + meta.icon + '</span>' +
              '<span style="flex:1;"><b>' + meta.name + ':</b> ' + name + '</span>' +
              '<span style="font-size:10px;">' + tag + '</span>' +
            '</div>';
        });

        var vRows = '';
        for (var i = 0; i < vehicles.length; i++) {
          vRows += '<div class="plate-item-row">' +
              '<span style="font-family:monospace; font-weight:bold; color:#f1c40f;">' + vehicles[i].number + '</span>' +
              '<span style="color:#bbb; font-size:11px;">' + (vehicles[i].driver ? '👤 ' + vehicles[i].driver : '') + '</span>' +
            '</div>';
        }

        var cargoOptionsHtml = '';
        CARGO_TYPES.forEach(function(cg) {
          cargoOptionsHtml += '<option value="' + cg + '" ' + (car.cargo === cg ? 'selected' : '') + '>' + cg + '</option>';
        });

        var editVehiclesRows = '';
        for (var vIdx = 0; vIdx < vehicles.length; vIdx++) {
          editVehiclesRows += '<div class="row" style="margin-top:2px;">' +
              '<input type="text" id="edit-veh-num-' + id + '-' + vIdx + '" class="plate-font" value="' + vehicles[vIdx].number + '" style="flex:1.1;" />' +
              '<input type="text" id="edit-veh-drv-' + id + '-' + vIdx + '" value="' + (vehicles[vIdx].driver || '') + '" placeholder="Водитель" style="flex:1.1;" />' +
              '<button class="btn-danger" style="padding:2px 8px;" onclick="removeVehicleInFullEdit(\'' + id + '\', ' + vIdx + ')">✕</button>' +
            '</div>';
        }

        var rNames = car.routeNames || {};
        var cargoConf = CARGO_CONFIG[car.cargo] || { label: car.cargo, svg: ICONS_SVG.bp };

        li.innerHTML = '<div class="car-card-header" onclick="selectCar(\'' + id + '\')">' +
            '<div>' +
              '<div class="car-card-unit">' + car.unit + '</div>' +
              '<div style="display:flex; align-items:center; gap:4px; flex-wrap:wrap;">' +
                '<span class="badge-cargo-tag">' + cargoConf.svg + ' ' + cargoConf.label + '</span>' +
                '<span class="column-badge-tag" style="background:' + (isColumn ? '#d35400' : '#2980b9') + '">' +
                  (isColumn ? 'КОЛОННА (' + vehicles.length + ' Т/С)' : '1 Т/С') +
                '</span>' +
                '<span class="time-badge">🕒 ' + car.statusUpdatedAt + '</span>' +
              '</div>' +
            '</div>' +
            '<div style="display:flex; align-items: center; gap:4px; flex-shrink:0;">' +
              '<button class="btn-gray" style="padding:3px 6px; font-size:10px;" onclick="event.stopPropagation(); toggleFullEditBox(\'' + id + '\')">⚙️ Редакт.</button>' +
              '<button class="btn-gray" style="padding:3px 6px; font-size:10px;" onclick="event.stopPropagation(); toggleEditBox(\'' + id + '\')">✏️ Пункты</button>' +
              '<button class="btn-danger" style="padding:3px 6px; font-size:10px;" onclick="event.stopPropagation(); deleteCar(event, \'' + id + '\')">✕</button>' +
            '</div>' +
          '</div>' +

          /* БЛОК ПОЛНОГО РЕДАКТИРОВАНИЯ КОЛОННЫ */
          '<div class="sub-box" id="full-edit-box-' + id + '" style="display: ' + (isFullEditing ? 'flex' : 'none') + '; border-color: #3b82f6;">' +
            '<label style="color:#3498db;">Полное редактирование карточки и колонны:</label>' +
            '<div class="row">' +
              '<input type="text" id="edit-unit-' + id + '" value="' + (car.unit || '') + '" placeholder="Подразделение" style="flex:1.3;" />' +
              '<select id="edit-cargo-' + id + '" style="flex:1; font-weight:bold; color:#f1c40f;">' +
                cargoOptionsHtml +
              '</select>' +
            '</div>' +
            '<label style="color:#aaa; font-size:10px; margin-top:4px;">Машины и водители в составе колонны:</label>' +
            '<div id="full-edit-vehicles-' + id + '">' + editVehiclesRows + '</div>' +
            '<div class="row" style="margin-top:4px;">' +
              '<input type="text" id="add-more-num-' + id + '" class="plate-font" placeholder="Новый номер" style="flex:1.1;" />' +
              '<input type="text" id="add-more-drv-' + id + '" placeholder="Фамилия" style="flex:1.1;" />' +
              '<button class="btn-blue" style="padding:4px 8px;" onclick="addVehicleInFullEdit(\'' + id + '\')">+ Добавить</button>' +
            '</div>' +
            '<div class="row" style="margin-top:6px;">' +
              '<button class="btn-green" style="flex:1;" onclick="applyFullEdit(\'' + id + '\')">✓ Сохранить изменения</button>' +
              '<button class="btn-gray" onclick="cancelFullEdit()">Отмена</button>' +
            '</div>' +
          '</div>' +

          /* СПИСОК НОМЕРОВ ТЕХНИКИ */
          '<div class="column-plates-container" onclick="event.stopPropagation();">' + vRows + '</div>' +

          /* СПИСОК ЭТАПОВ МАРШРУТА */
          '<div class="route-stage-list" onclick="selectCar(\'' + id + '\')">' + stagesHtml + '</div>' +

          /* РЕДАКТИРОВАНИЕ ПУНКТОВ */
          '<div class="sub-box" id="edit-box-' + id + '" style="display: ' + (isEditing ? 'flex' : 'none') + ';">' +
            '<label style="color:#f1c40f;">Задать названия пунктов:</label>' +
            '<input type="text" id="input-start-' + id + '" placeholder="🏁 Пункт начала" value="' + (rNames.start || '') + '" style="margin-bottom:4px;" />' +
            '<input type="text" id="input-loading-' + id + '" placeholder="📦 Пункт погрузки" value="' + (rNames.loading || '') + '" style="margin-bottom:4px;" />' +
            '<input type="text" id="input-unloading-' + id + '" placeholder="📤 Пункт выгрузки" value="' + (rNames.unloading || '') + '" style="margin-bottom:4px;" />' +
            '<input type="text" id="input-assembly-' + id + '" placeholder="🛡️ Р-н сосредоточения" value="' + (rNames.assembly || '') + '" style="margin-bottom:4px;" />' +
            '<div class="row" style="margin-top: 4px;">' +
              '<button class="btn-green" style="flex: 1;" onclick="applyRouteNames(\'' + id + '\')">✓ Применить</button>' +
              '<button class="btn-gray" onclick="cancelEdit()">Отмена</button>' +
            '</div>' +
          '</div>' +

          '<div class="row" style="margin-top:2px;">' +
            '<select onchange="changeCarStatus(\'' + id + '\', this.value)" style="flex:1.2; font-size:11px; padding:3px;">' +
              '<option value="moving" ' + (car.status === 'moving' ? 'selected' : '') + '>🟢 В пути</option>' +
              '<option value="night" ' + (car.status === 'night' ? 'selected' : '') + '>🌙 Ночлег</option>' +
              '<option value="loading" ' + (car.status === 'loading' ? 'selected' : '') + '>🟠 На погрузке</option>' +
              '<option value="unloading" ' + (car.status === 'unloading' ? 'selected' : '') + '>🔵 На выгрузке</option>' +
              '<option value="stopped" ' + (car.status === 'stopped' ? 'selected' : '') + '>⚪ Стоит</option>' +
            '</select>' +
            '<button class="btn-blue" style="font-size:11px; padding:3px 8px;" onclick="advanceStage(\'' + id + '\')">➡️ След. этап</button>' +
          '</div>';

        list.appendChild(li);
      }

      document.getElementById('list-count-label').innerText = 'Объекты на контроле (Всего: ' + count + '):';
    }

    function selectCar(id) {
      selectedCarId = id;
      renderAll();
      if (id && appData.cars[id] && yMap) {
        yMap.panTo(appData.cars[id].coords, { duration: 400 });
      }
      if (activeConn && activeConn.open) {
        activeConn.send({ type: 'SELECT_CAR', selectedCarId: id, coords: id ? appData.cars[id].coords : null });
      }
    }

    function changeCarStatus(id, st) {
      if (appData.cars[id]) {
        appData.cars[id].status = st;
        appData.cars[id].statusUpdatedAt = getNowTimeString();
        saveData();
        renderAll();
      }
    }

    function advanceStage(id) {
      if (appData.cars[id]) {
        appData.cars[id].stageIndex = ((appData.cars[id].stageIndex || 0) + 1) % 4;
        appData.cars[id].statusUpdatedAt = getNowTimeString();
        saveData();
        renderAll();
      }
    }

    function deleteCar(e, id) {
      if (e) e.stopPropagation();
      delete appData.cars[id];
      if (selectedCarId === id) selectedCarId = null;
      if (activeEditCarId === id) activeEditCarId = null;
      if (activeFullEditCarId === id) activeFullEditCarId = null;
      saveData();
      renderAll();
    }

    // PEERJS СИНХРОНИЗАЦИЯ
    var tvCode = 'tv-' + Math.floor(100 + Math.random() * 900);
    var peer = new Peer(tvCode);
    var activeConn = null;

    peer.on('open', function(id) {
      document.getElementById('peer-id-display').innerText = id;
    });

    peer.on('connection', function(conn) {
      activeConn = conn;
      var tvBadge = document.getElementById('tv-badge');
      if (tvBadge) {
        tvBadge.style.background = '#27ae60';
        tvBadge.innerHTML = 'Связка активна ✓';
        setTimeout(function() {
          tvBadge.style.opacity = '0';
          setTimeout(function() { tvBadge.style.display = 'none'; }, 500);
        }, 4000);
      }

      conn.on('open', function() {
        conn.send({
          type: 'HANDSHAKE',
          data: appData,
          selectedCarId: selectedCarId,
          mapView: yMap ? { center: yMap.getCenter(), zoom: yMap.getZoom() } : null
        });
      });

      conn.on('data', handleIncomingMessage);
    });

    document.getElementById('btn-connect-tv').onclick = function() {
      var target = document.getElementById('target-tv-id').value.trim();
      if (!target) return;
      document.getElementById('sync-status').innerText = 'Связка с ' + target + '...';

      var conn = peer.connect(target);
      conn.on('open', function() {
        activeConn = conn;
        document.getElementById('sync-status').innerText = '✓ Подключено к ТВ';
        document.getElementById('sync-status').style.color = '#2ecc71';

        conn.send({
          type: 'HANDSHAKE',
          data: appData,
          selectedCarId: selectedCarId,
          mapView: yMap ? { center: yMap.getCenter(), zoom: yMap.getZoom() } : null
        });
      });

      conn.on('data', handleIncomingMessage);
    };

    function handleIncomingMessage(msg) {
      if (!msg) return;

      if (msg.type === 'FORCE_SCREEN_MODE') {
        applyLocalScreenMode(msg.mode);
        appData.tvScreenMode = msg.mode;
        updateTvModeButtonUI();
        return;
      }

      if (msg.type === 'HANDSHAKE') {
        var remoteTime = (msg.data && msg.data.updatedAt) || 0;
        var localTime = appData.updatedAt || 0;

        if (remoteTime > localTime) {
          appData = msg.data;
          for (var k in appData.cars) { appData.cars[k] = sanitizeCarData(appData.cars[k]); }
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
          selectedCarId = msg.selectedCarId;
          renderAll();
        } else if (localTime > remoteTime) {
          broadcastData();
        }

        if (msg.data && msg.data.tvScreenMode) {
          applyLocalScreenMode(msg.data.tvScreenMode);
        }

        if (msg.mapView && yMap) {
          applyRemoteView(msg.mapView.center, msg.mapView.zoom);
        }
      } else if (msg.type === 'DATA_UPDATE') {
        appData = msg.data;
        for (var key in appData.cars) { appData.cars[key] = sanitizeCarData(appData.cars[key]); }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        selectedCarId = msg.selectedCarId;
        renderAll();
      } else if (msg.type === 'SELECT_CAR') {
        selectedCarId = msg.selectedCarId;
        renderAll();
        if (msg.coords && yMap) {
          yMap.panTo(msg.coords, { duration: 400 });
        }
      } else if (msg.type === 'MAP_VIEW') {
        if (yMap) applyRemoteView(msg.center, msg.zoom);
      }
    }

    function applyRemoteView(center, zoom) {
      isApplyingRemoteView = true;
      yMap.setCenter(center, zoom, { duration: 150 }).then(function() {
        setTimeout(function() { isApplyingRemoteView = false; }, 50);
      });
    }

    function broadcastData() {
      if (activeConn && activeConn.open) {
        activeConn.send({ type: 'DATA_UPDATE', data: appData, selectedCarId: selectedCarId });
      }
    }

    function broadcastMapView() {
      if (activeConn && activeConn.open && yMap) {
        activeConn.send({ type: 'MAP_VIEW', center: yMap.getCenter(), zoom: yMap.getZoom() });
      }
    }
  </script>
</body>
</html>
